name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

env:
  ACTIONS_STEP_DEBUG: true
  ACTIONS_RUNNER_DEBUG: true

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        ruby: ["3.4"]
        include:
          # Test versions from Debian 12
          - os: ubuntu-latest
            ruby: "3.1"
          # Test versions from Amazon Linux 2023 and Ubuntu 24.04
          - os: ubuntu-latest
            ruby: "3.2"
          # Test versions from RHEL8 & RHEL9 & RHEL10 && Ubuntu 26.04
          - os: ubuntu-latest
            ruby: "3.3"
    runs-on: ${{ matrix.os }}
    name: Unit tests

    steps:
      - name: Checkout ${{ github.sha }}
        uses: actions/checkout@v6

      - name: Setup Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: 2.5.23
          rubygems: 'latest'

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/vendor/bundle
          key: ${{ runner.os }}-${{ matrix.ruby }}-unit-gems-${{ hashFiles('apps/*/Gemfile.lock', 'Gemfile.lock') }}-1

      - name: Setup os dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone libsqlite3-dev

      - name: Setup Bundler
        run: |
          # try to update gems - this can fail on ruby 3.0
          gem update --system || true
          bundle config path ~/vendor/bundle
          bundle install --without e2e
          gem install rake

      - name: Run unit tests
        run: bundle exec rake test:unit

      - name: Test E2E helpers
        run: bundle exec rspec spec/e2e_helper_spec.rb

      - name: Run ShellCheck
        run: bundle exec rake test:shellcheck

      - name: Check file encodings
        run: bundle exec rake test:unix

      - name: Run Zeitwerk check
        run: |
          cd apps/dashboard
          bundle install
          bundle exec rake zeitwerk:check

      - name: Run lint tests
        run: bundle exec rake lint || true

      - name: Run System Dashboard tests
        run: cd apps/dashboard; bin/rake test:system

      - name: Upload system test failures.
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: system-test-failures-${{ matrix.ruby }}
          path: |
            apps/dashboard/tmp/screenshots/*.png
            apps/dashboard/log/test.log

  k8s-tests:
    runs-on: ubuntu-latest
    name: Kubernetes tests
    steps:
      - name: Checkout ${{ github.sha }}
        uses: actions/checkout@v6
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.31.0
          cluster_name: kind
          node_image: kindest/node:v1.32.11@sha256:5fc52d52a7b9574015299724bd68f183702956aa4a2116ae75a63cb574b35af8
      - name: Apply ondemand RBAC
        run: kubectl apply -f hooks/k8s-bootstrap/ondemand.yaml
      - name: Get ondemand token
        id: token
        run: |
           TOKEN=$(kubectl create token ondemand --namespace=ondemand)
           echo "ondemand=${TOKEN}" >> "$GITHUB_OUTPUT"
      - name: Setup kubectl
        run: |
          kubectl config set-credentials ondemand --token="${{ steps.token.outputs.ondemand }}"
          kubectl config set-context kind-kind --user=ondemand
          kubectl config use-context kind-kind
          kubectl cluster-info
      - name: Test k8s-bootstrap
        run: /bin/bash hooks/k8s-bootstrap/k8s-bootstrap-ondemand.sh test hooks/hook.env.example

  e2e-tests:
    strategy:
      fail-fast: false
      matrix:
        dist:
          - el8
          - el9
          - el10
          - amzn2023
          - ubuntu-24.04
          - ubuntu-26.04
          - debian-12
          - debian-13
        # PowerPC still needs emulation; run it nightly or on manual dispatch.
        arch: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["x86_64","aarch64","ppc64le"]' || '["x86_64","aarch64"]') }}
        version: ["4.2"]
        exclude:
          # These ARM repos do not yet publish ondemand-nginx or ondemand-passenger.
          - dist: el10
            arch: aarch64
          - dist: amzn2023
            arch: aarch64
          # Amazon 2023 doesn't have ppc64le containers
          - dist: amzn2023
            arch: ppc64le
          # PowerPC DEB targets need separate build-box and Node.js 22 validation.
          - dist: ubuntu-24.04
            arch: ppc64le
          - dist: ubuntu-26.04
            arch: ppc64le
          - dist: debian-12
            arch: ppc64le
          - dist: debian-13
            arch: ppc64le
    # Keep Ruby and the browser native. Only the PowerPC target is emulated.
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-22.04' }}
    name: E2E test ${{ matrix.dist }}-${{ matrix.arch }}
    timeout-minutes: 240

    env:
      OOD_REPO_PASSWORD: ${{ secrets.OOD_OSC_EARLY_ACCESS_PASSWORD }}
      HAS_DOCKERHUB_CREDENTIALS: ${{ secrets.ONDEMAND_DOCKERHUB_USER != '' && secrets.ONDEMAND_DOCKERHUB_PASSWORD != '' }}
      OOD_E2E_BROWSER: ${{ matrix.arch == 'aarch64' && 'firefox' || 'chrome' }}
    steps:
      - name: Checkout ${{ github.sha }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Ruby using Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler: "2.5.23"
          bundler-cache: true

      - name: Login to Docker Hub
        if: env.HAS_DOCKERHUB_CREDENTIALS == 'true'
        run: docker login -u ${{ secrets.ONDEMAND_DOCKERHUB_USER }} -p ${{ secrets.ONDEMAND_DOCKERHUB_PASSWORD }}

      - name: Set up PowerPC emulation
        if: matrix.arch == 'ppc64le'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ppc64le

      - name: Check browser and driver
        run: |
          if [[ "$OOD_E2E_BROWSER" == 'firefox' ]]; then
            firefox --version
            geckodriver --version
            # The locked Selenium Manager binary is x86; use the native driver directly.
            echo "SE_GECKODRIVER=$(command -v geckodriver)" >> "$GITHUB_ENV"
          else
            google-chrome --version
            chromedriver --version
          fi

      - name: Build package
        run: |
          # Docker supports the PowerPC binfmt registration and EL8 packaging.
          if [[ "${{ matrix.arch }}" == 'ppc64le' || "${{ matrix.dist }}" == "el8" ]]; then
            unset CONTAINER_RT
          fi
          if [[ "${{ matrix.dist }}" == "debian-13" || "${{ matrix.dist }}" == "ubuntu-26.04" ]]; then
            unset CONTAINER_RT
          fi
          bundle exec rake 'package:build[${{ matrix.dist }},${{ matrix.arch }}]'
        timeout-minutes: ${{ matrix.arch == 'ppc64le' && 150 || (matrix.arch == 'aarch64' && 60 || 20) }}
        env:
          VERSION: "${{ matrix.version }}.0"
          OOD_PACKAGING_DEBUG: 'true'
          CONTAINER_RT: 'podman'

      - name: Run package tests
        run: bundle exec rake test:e2e
        timeout-minutes: ${{ matrix.arch == 'ppc64le' && 60 || 30 }}
        env:
          BEAKER_set: ${{ matrix.arch == 'x86_64' && matrix.dist || format('{0}-{1}', matrix.dist, matrix.arch) }}
          OOD_BUILD_REPO: ${{ matrix.version }}
          OOD_E2E_EXPECTED_ARCH: ${{ matrix.arch }}

      - name: Debug failure
        if: failure()
        run: |
          if [ -d tmp/e2e_ctr/ ]; then
            find tmp/e2e_ctr/ -type f -name '*.log' -exec cat {} +
          else
            echo "No E2E container log directory found at tmp/e2e_ctr/."
          fi
