name: E2E

on:
  push:
    branches: [master]
  pull_request_target:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

env:
  ACTIONS_STEP_DEBUG: true
  ACTIONS_RUNNER_DEBUG: true

jobs:
  authorize:
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'external' || 'internal' }}
    runs-on: ubuntu-latest
    steps:
      - name: Code Review Required
        run: echo "PR approved or originating internally."

  e2e-tests:
    needs: authorize
    strategy:
      fail-fast: false
      matrix:
        dist:
          - el8
          - el9
          - el10
          - amzn2023
          - ubuntu-24.04
          - ubuntu-26.04
          - debian-12
          - debian-13
        # PowerPC still needs emulation; run it nightly.
        arch: ${{ fromJSON(github.event_name == 'schedule' && '["x86_64","aarch64","ppc64le"]' || '["x86_64","aarch64"]') }}
        version: ["4.2"]
        exclude:
          # el10 on aarch64 times out
          # These ARM repos do not yet publish ondemand-nginx or ondemand-passenger.
          - dist: el10
            arch: aarch64
          # Amazon 2023 on aarch64 is very slow and will time out
          - dist: amzn2023
            arch: aarch64
          # Amazon 2023 doesn't have ppc64le containers
          - dist: amzn2023
            arch: ppc64le
          # Ubuntu and Debian doesn't have way to get NodeJS 20+ on ppc64le
          - dist: ubuntu-24.04
            arch: ppc64le
          - dist: ubuntu-26.04
            arch: ppc64le
          - dist: debian-12
            arch: ppc64le
          - dist: debian-13
            arch: ppc64le
    # Keep Ruby and the browser native. Only the PowerPC target is emulated.
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-22.04' }}
    name: E2E test ${{ matrix.dist }}-${{ matrix.arch }}
    timeout-minutes: 240

    env:
      OOD_REPO_PASSWORD: ${{ secrets.OOD_OSC_EARLY_ACCESS_PASSWORD }}
      OOD_REPO_USERNAME: ${{ secrets.OOD_OSC_EARLY_ACCESS_USERNAME }}
      HAS_DOCKERHUB_CREDENTIALS: ${{ secrets.ONDEMAND_DOCKERHUB_USER != '' && secrets.ONDEMAND_DOCKERHUB_PASSWORD != '' }}
      OOD_E2E_BROWSER: ${{ matrix.arch == 'aarch64' && 'firefox' || 'chrome' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          allow-unsafe-pr-checkout: true
          ref: ${{ github.event_name == 'pull_request_target' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}

      - name: Setup Ruby using Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler: "2.5.23"
          bundler-cache: true

      - name: Login to Docker Hub
        if: env.HAS_DOCKERHUB_CREDENTIALS == 'true'
        run: docker login -u ${{ secrets.ONDEMAND_DOCKERHUB_USER }} -p ${{ secrets.ONDEMAND_DOCKERHUB_PASSWORD }}

      - name: Set up PowerPC emulation
        if: matrix.arch == 'ppc64le'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ppc64le

      - name: Check browser and driver
        run: |
          if [[ "$OOD_E2E_BROWSER" == 'firefox' ]]; then
            firefox --version
            geckodriver --version
            # The locked Selenium Manager binary is x86; use the native driver directly.
            echo "SE_GECKODRIVER=$(command -v geckodriver)" >> "$GITHUB_ENV"
          else
            google-chrome --version
            chromedriver --version
          fi

      - name: Build package
        run: |
          # Use Docker for emulated PowerPC builds and EL8 packaging.
          if [[ "${{ matrix.arch }}" == 'ppc64le' || "${{ matrix.dist }}" == "el8" ]]; then
            unset CONTAINER_RT
          fi
          if [[ "${{ matrix.dist }}" == "debian-13" || "${{ matrix.dist }}" == "ubuntu-26.04" ]]; then
            unset CONTAINER_RT
          fi
          bundle exec rake 'package:build[${{ matrix.dist }},${{ matrix.arch }}]'
        timeout-minutes: ${{ matrix.arch == 'ppc64le' && 150 || (matrix.arch == 'aarch64' && 60 || 20) }}
        env:
          VERSION: "${{ matrix.version }}.0"
          OOD_PACKAGING_DEBUG: 'true'
          CONTAINER_RT: 'podman'

      - name: Run package tests
        run: bundle exec rake test:e2e
        timeout-minutes: ${{ matrix.arch == 'ppc64le' && 60 || 30 }}
        env:
          BEAKER_set: ${{ matrix.arch == 'x86_64' && matrix.dist || format('{0}-{1}', matrix.dist, matrix.arch) }}
          OOD_BUILD_REPO: ${{ matrix.version }}

      - name: Debug failure
        if: failure()
        run: |
          if [ -d tmp/e2e_ctr/ ]; then
            find tmp/e2e_ctr/ -type f -name '*.log' -exec cat {} +
          else
            echo "No E2E container log directory found at tmp/e2e_ctr/."
          fi
