name: E2E

on:
  push:
    branches: [master]
  pull_request_target:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

env:
  ACTIONS_STEP_DEBUG: true
  ACTIONS_RUNNER_DEBUG: true

jobs:
  authorize:
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'external' || 'internal' }}
    runs-on: ubuntu-latest
    steps:
      - name: Code Review Required
        run: echo "PR approved or originating internally."

  e2e-tests:
    needs: authorize
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        dist:
          - el8
          - el9
          - el10
          - amzn2023
          - ubuntu-24.04
          - ubuntu-26.04
          - debian-12
          - debian-13
        arch:
          - x86_64
          - aarch64
          - ppc64le
        version: ["4.2"]
        exclude:
          # el10 on aarch64 times out
          - dist: el10
            arch: aarch64
          # Amazon 2023 on aarch64 is very slow and will time out
          - dist: amzn2023
            arch: aarch64
          # Amazon 2023 doesn't have ppc64le containers
          - dist: amzn2023
            arch: ppc64le
          # Ubuntu and Debian doesn't have way to get NodeJS 20+ on ppc64le
          - dist: ubuntu-24.04
            arch: ppc64le
          - dist: ubuntu-26.04
            arch: ppc64le
          - dist: debian-12
            arch: ppc64le
          - dist: debian-13
            arch: ppc64le
    runs-on: ${{ matrix.os }}
    name: E2E test ${{ matrix.dist }}-${{ matrix.arch }}

    env:
      OOD_REPO_PASSWORD: ${{ secrets.OSC_OOD_REPO_PASSWORD }}
      OOD_REPO_USERNAME: ${{ secrets.OSC_OOD_REPO_USERNAME }}
      HAS_DOCKERHUB_CREDENTIALS: ${{ secrets.ONDEMAND_DOCKERHUB_USER != '' && secrets.ONDEMAND_DOCKERHUB_PASSWORD != '' }}
    steps:
      - name: Checkout ${{ github.event.pull_request.head.sha	}}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          allow-unsafe-pr-checkout: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Ruby using Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler: "2.5.23"
          bundler-cache: true

      - name: Login to Docker Hub
        if: env.HAS_DOCKERHUB_CREDENTIALS == 'true'
        run: docker login -u ${{ secrets.ONDEMAND_DOCKERHUB_USER }} -p ${{ secrets.ONDEMAND_DOCKERHUB_PASSWORD }}

      - name: Build package
        if: matrix.arch == 'x86_64'
        run: |
          # have to use docker for el8 packaging.
          if [[ "${{ matrix.dist }}" == "el8" ]]; then
            unset CONTAINER_RT
          fi
          if [[ "${{ matrix.dist }}" == "debian-13" || "${{ matrix.dist }}" == "ubuntu-26.04" ]]; then
             unset CONTAINER_RT
           fi
          bundle exec rake package:build[${{ matrix.dist }},${{ matrix.arch }}]
        timeout-minutes: 20
        env:
          VERSION: "${{ matrix.version }}.0"
          OOD_PACKAGING_DEBUG: 'true'
          CONTAINER_RT: 'podman'

      - name: Run package tests
        if: matrix.arch == 'x86_64'
        run: bundle exec rake test:e2e
        env:
          BEAKER_set: ${{ matrix.dist }}
          OOD_BUILD_REPO: ${{ matrix.version }}

      - name: arch distro
        if: ${{ matrix.arch != 'x86_64' && github.event_name == 'schedule' }}
        run: |
          DISTRO=$(echo "${{ matrix.os }}" | sed 's|\-||g')
          echo "DISTRO=${DISTRO}" >> $GITHUB_ENV
          if [ "${{ matrix.arch }}" == "aarch64" ]; then
            echo "PLATFORM=linux/arm64" >> $GITHUB_ENV
          fi
          if [ "${{ matrix.arch }}" == "ppc64le" ]; then
            echo "PLATFORM=linux/ppc64le" >> $GITHUB_ENV
          fi

      - name: Test OnDemand
        if: ${{ matrix.arch != 'x86_64' && github.event_name == 'schedule' }}
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: ${{ matrix.arch }}
          distro: ${{ env.DISTRO }}
          githubToken: ${{ github.token }}
          install: |
            apt update -y
            apt install -y ruby-bundler ruby-dev build-essential git \
              apt-transport-https ca-certificates curl software-properties-common
            # Not available for ppc64le
            # apt install -y chromium-chromedriver
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
            apt update -y
            apt install -y docker-ce
          dockerRunArgs: |
            --platform ${{ env.PLATFORM }}
          run: |
            git config --global --add safe.directory $GITHUB_WORKSPACE
            bundle install
            bundle exec rake package:build[${{ matrix.dist }},${{ matrix.arch }}]
            # e2e tests fail with issues accessing chorium
            # bundle exec rake test:e2e
          env: |
            VERSION: "${{ matrix.version }}.0"
            OOD_PACKAGING_DEBUG: 'true'
            BEAKER_set: ${{ matrix.dist }}-${{ matrix.arch }}
            OOD_BUILD_REPO: ${{ matrix.version }}
            DOCKER_IN_DOCKER: 'true'

      - name: Debug failure
        if: failure()
        run: |
          if [ -d tmp/e2e_ctr/ ]; then
            find tmp/e2e_ctr/ -type f -name '*.log' -exec cat {} +
          else
            echo "No E2E container log directory found at tmp/e2e_ctr/."
          fi
