name: Secret scan

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: ['**']
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      all_refs:
        description: Scan all fetched branches and tags
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  secret-scan:
    name: Detect leaked secrets
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git commits with Gitleaks
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SCAN_ALL_REFS: ${{ inputs.all_refs }}
        run: |
          git_dir="$GITHUB_WORKSPACE/.git"
          scan_dir=$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")
          trap 'rm -rf -- "$scan_dir"' EXIT
          umask 077

          head=$(git -C "$git_dir" rev-parse --verify "$HEAD_SHA^{commit}")
          revision="$head"
          scope="history reachable from the selected ref"
          case "$GITHUB_EVENT_NAME" in
            pull_request|merge_group)
              base=$(git -C "$git_dir" rev-parse --verify "$BASE_SHA^{commit}")
              revision="$base..$head"
              scope="commits introduced by the pull request or merge group"
              ;;
            push)
              if base=$(git -C "$git_dir" rev-parse --verify "$BASE_SHA^{commit}" 2>/dev/null); then
                revision="$base..$head"
                scope="commits introduced by the push"
              fi
              ;;
            workflow_dispatch)
              if [[ "$SCAN_ALL_REFS" == true ]]; then
                revision=--all
                scope="history across all fetched refs"
              fi
              ;;
          esac
          echo "Scanning $scope."

          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}?download=1" \
            --output "$scan_dir/$archive"
          (
            cd "$scan_dir"
            echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
            tar -xzf "$archive" gitleaks
          )

          # Read the reviewed allowlist from the default branch. A push to that
          # branch cannot use allowlist entries added by the same push.
          allow_ref="refs/remotes/origin/$DEFAULT_BRANCH"
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
            allow_ref="$BASE_SHA"
          fi
          if trusted=$(git -C "$git_dir" rev-parse --verify "$allow_ref^{commit}" 2>/dev/null) &&
             git -C "$git_dir" cat-file -e "$trusted:.gitleaksignore" 2>/dev/null; then
            git -C "$git_dir" cat-file blob "$trusted:.gitleaksignore" > "$scan_dir/allowlist"
          fi

          # Scan .git with built-in rules. Checkout settings and inline allows
          # cannot change detection. Raw scanner output stays in private files.
          printf '[extend]\nuseDefault = true\n' > "$scan_dir/config.toml"
          real_git=$(command -v git)
          mkdir "$scan_dir/bin"
          # Gitleaks can report success after its git log subprocess fails.
          cat > "$scan_dir/bin/git" <<'GIT'
          #!/usr/bin/env bash
          if [[ "${3:-}" != log ]]; then
            exec "$REAL_GIT" "$@"
          fi
          status=0
          "$REAL_GIT" "$@" || status=$?
          if (( status != 0 )); then
            touch "$GIT_LOG_FAILED"
          fi
          exit "$status"
          GIT
          chmod +x "$scan_dir/bin/git"

          scan() {
            local report="$1" phase="$2" log_opts="$3" status=0
            rm -f "$scan_dir/git-log-failed"
            REAL_GIT="$real_git" GIT_LOG_FAILED="$scan_dir/git-log-failed" PATH="$scan_dir/bin:$PATH" \
            "$scan_dir/gitleaks" git "$git_dir" \
              --config "$scan_dir/config.toml" \
              --gitleaks-ignore-path "$scan_dir" --ignore-gitleaks-allow \
              --log-opts="--no-ext-diff --no-textconv --text $log_opts --" \
              --no-banner --log-level=error --exit-code=42 --report-format=json \
              --report-path="$scan_dir/$report.json" > "$scan_dir/scanner.log" 2>&1 || status=$?
            if [[ -e "$scan_dir/git-log-failed" ]]; then
              echo "::error title=Secret scan failed::Git could not read all patches while scanning $phase."
              return 1
            fi
            if [[ -s "$scan_dir/scanner.log" ]] || (( status != 0 && status != 42 )); then
              echo "::error title=Secret scan failed::Gitleaks reported an error while scanning $phase (exit $status)."
              return 1
            fi
          }

          scan report-history "commit history" "--full-history --diff-merges=remerge $revision"

          # Git only remerges two-parent commits. Scan octopus merges separately
          # so a secret added in one still has a chance to be detected.
          git -C "$git_dir" rev-list --min-parents=3 "$revision" -- > "$scan_dir/octopus"
          batch=0
          while mapfile -t -n 128 merges && (("${#merges[@]}")); do
            batch=$((batch + 1))
            scan "report-octopus-$batch" "octopus merges" \
              "--no-walk --diff-merges=first-parent ${merges[*]}"
          done < "$scan_dir/octopus"

          python3 - "$scan_dir" <<'PYTHON'
          import json
          from pathlib import Path
          import re
          import subprocess
          import sys

          scan_dir = Path(sys.argv[1])
          allowlist = scan_dir / "allowlist"
          # Accept only commit-specific fingerprints. Path-only exclusions
          # would also suppress future secrets on the same line.
          allowed = set(allowlist.read_text().splitlines()) if allowlist.exists() else set()
          findings = []
          for report in sorted(scan_dir.glob("report-*.json")):
              findings.extend(json.loads(report.read_text()) or [])

          active = [finding for finding in findings if finding["Fingerprint"] not in allowed]
          if not active:
              print(f"No findings to review ({len(findings)} suppressed).")
              sys.exit(0)

          visible = active[:20]
          secrets = {finding["Secret"] for finding in findings if finding["Secret"]}
          paths = sorted({finding["File"] for finding in visible if finding["File"].isprintable()})
          hidden_paths = {path for path in paths if any(secret in path for secret in secrets)}
          candidates = [path for path in paths if path not in hidden_paths]
          if candidates:
              # Screen the path text itself before publishing it. The scanner's
              # stdout and stderr can contain repository-controlled text.
              path_report = scan_dir / "path-findings.json"
              scanner_log = scan_dir / "scanner.log"
              with scanner_log.open("wb") as errors:
                  screening = subprocess.run(
                      [str(scan_dir / "gitleaks"), "stdin", "--config", str(scan_dir / "config.toml"),
                       "--gitleaks-ignore-path", str(scan_dir), "--ignore-gitleaks-allow",
                       "--redact=100", "--no-banner", "--log-level=error", "--exit-code=42",
                       "--report-format=json", "--report-path", str(path_report)],
                      input="\n".join(candidates) + "\n", text=True, cwd=scan_dir,
                      stdout=subprocess.DEVNULL, stderr=errors, check=False,
                  )
              if scanner_log.stat().st_size or screening.returncode not in (0, 42):
                  print("Filename screening failed. File paths are hidden for this run.")
                  hidden_paths.update(candidates)
              elif screening.returncode == 42:
                  for finding in json.loads(path_report.read_text()):
                      start, end = finding["StartLine"], finding["EndLine"]
                      if 1 <= start <= end <= len(candidates):
                          hidden_paths.update(candidates[start - 1:end])
                      else:
                          hidden_paths.update(candidates)

          for finding in visible:
              commit = finding["Commit"]
              rule = finding["RuleID"]
              line = int(finding["StartLine"])
              if not re.fullmatch(r"[0-9a-f]{40}(?:[0-9a-f]{24})?", commit):
                  commit = "[unknown commit]"
              if not re.fullmatch(r"[a-zA-Z0-9_-]+", rule):
                  rule = "[unknown rule]"
              path = finding["File"]
              location = "[path hidden]"
              if path.isprintable() and path not in hidden_paths:
                  # Escape workflow-command delimiters and terminal control characters.
                  location = json.dumps(path).replace(":", r"\u003a").replace("#", r"\u0023")
              print(f"{commit} {location}:{line} ({rule})")

          print(f"{len(active)} potential secret findings ({len(visible)} shown, "
                f"{len(findings) - len(active)} suppressed).")
          print("::error title=Potential secrets found::Review the locations in the scan log.")
          sys.exit(1)
          PYTHON
