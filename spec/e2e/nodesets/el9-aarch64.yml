HOSTS:
  el9:
    roles:
      - agent
    platform: el-9-aarch64
    hypervisor: docker
    image: arm64v8/rockylinux:9
    docker_preserve_image: true
    docker_cmd: '/usr/sbin/init'
    docker_image_commands:
      - 'dnf install -y dnf-utils'
      - 'dnf config-manager --set-enabled crb'
      - 'dnf install -y wget which cronie iproute initscripts langpacks-en glibc-all-langpacks'
    docker_env:
      - LANG=en_US.UTF-8
      - LANGUAGE=en_US.UTF-8
      - LC_ALL=en_US.UTF-8
    docker_container_name: 'ondemand-el9'
    docker_port_bindings:
      22/tcp:
        - HostPort: '2222'
          HostIp: '127.0.0.1'
      8080/tcp:
        - HostPort: '8080'
          HostIp: '0.0.0.0'
      5556/tcp:
        - HostPort: '5556'
          HostIp: '0.0.0.0'
CONFIG:
  # Cold image builds can exceed beaker-docker's 300-second API read timeout.
  # The workflow still bounds the complete E2E step to 30 minutes.
  docker_options:
    read_timeout: 900
  log_level: debug
  type: foss
ssh:
  password: root
  auth_methods: ["password"]

